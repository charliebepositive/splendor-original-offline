plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

def signing = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.local.splendor'
    compileSdk 36
    defaultConfig {
        applicationId 'com.local.splendor'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets { main.assets.srcDirs = [layout.buildDirectory.dir('generated/web-assets')] }
}

tasks.register('syncWebAssets', Sync) {
    from('../../splendor-original') {
        include 'index.html', 'manifest.json', 'css/**', 'js/engine.js', 'js/ai.js', 'js/data.js', 'js/ui.js', 'js/platform.js'
        include 'assets/**', 'docs/rules.html', 'docs/Splendor-EN.pdf', 'docs/SOURCES.md', 'docs/CARD-SOURCE-LICENSE.txt', 'LICENSE'
    }
    into layout.buildDirectory.dir('generated/web-assets/www')
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }

dependencies {
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.webkit:webkit:1.14.0'
}
